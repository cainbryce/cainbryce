name: Update WakaTime Stats

# Renders the same block as athul/waka-readme, minus the Docker build:
# one step, curl + jq, both already on the runner.

on:
  schedule:
    # Shortly after midnight Mountain time, when the 30-day window moves on.
    # Off the top of the hour, where GitHub delays scheduled runs.
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with WakaTime stats
    # Measured against ubuntu-slim for this job: about 1.5 s faster per run.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update README
        shell: bash
        env:
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_0AUTH_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          STATS_URL: https://wakatime.com/api/v1/users/current/stats/last_30_days
          COMMIT_MESSAGE: "ci: update WakaTime stats"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"

          readme_url=$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/README.md
          github=(-H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json")

          get() { curl -sS --fail-with-body --retry 2 --max-time 30 "$@"; }

          # Only exit 22 guarantees the saved body is an HTTP error message.
          # Anything else could be a partial stats download, and this log is public.
          fail() { [ "$1" = 22 ] && cat "$2"; echo; exit 1; }

          get "${github[@]}" "$readme_url" -o readme.json &
          readme_pid=$!

          # WakaTime answers with stale stats while it recomputes them, typically
          # on the first request after midnight. Poll until they are fresh,
          # for about 3.5 minutes at most.
          for attempt in {1..20}; do
            get -H "Authorization: Bearer $WAKATIME_TOKEN" "$STATS_URL" -o stats.json || fail $? stats.json
            jq -e .data.is_up_to_date stats.json >/dev/null && break
            echo "WakaTime is still recomputing (poll $attempt)"
            sleep "$attempt"
          done

          wait "$readme_pid" || fail $? readme.json

          jq -nc '
            def rep($s; $n): if $n > 0 then $s * $n else "" end;
            def rpad($n): . + rep(" "; $n - length);
            def zpad: tostring | rep("0"; 2 - length) + .;
            def day:
              .[:10] | split("-")
              | [.[2], ("January February March April May June July August September October November December" | split(" "))[(.[1] | tonumber) - 1], .[0]]
              | join(" ");
            def bar:
              (. / 100 * 25) as $p
              | ($p + 0.5 / 3 | floor) as $full
              | (($p - $full) * 3 + 0.5 | floor) as $part
              | rep("█"; $full) + (if $part > 0 then "░▒▓█"[$part:$part + 1] else "" end)
              | . + rep("░"; 25 - length);
            def pct: (. * 100 | round) as $c | "\($c / 100 | floor | zpad).\($c % 100 | zpad)";

            (input.data // error("WakaTime response has no stats")) as $d
            | input as $file
            | "<!--START_SECTION:waka-->" as $start
            | "<!--END_SECTION:waka-->" as $end
            | ($d.languages // []) as $langs
            | (if ($langs | length) == 0 and ($d.is_up_to_date | not) then error("WakaTime stats are not ready") else . end)
            | ([$langs[].name | length] | max) as $width
            | ( "From: \($d.start | day) - To: \($d.end | day)\n\n"
              + ( [$d.human_readable_total_including_other_language, $d.human_readable_total | select(. != null and . != "")][0]
                  | (if . then "Total Time: \(.)\n\n" else "" end) )
              + ( if ($langs | length) == 0 then "No activity tracked"
                  else [$langs[:20][] | "\(.name | rpad($width))   \(.text | rpad(22))\(.percent | bar)   \(.percent | pct) %"] | join("\n")
                  end )
              ) as $stats
            | ($file.content | split("\n") | join("") | @base64d) as $old
            | ($old | split($start)) as $head
            | ($old | split($end)) as $tail
            | (if ($head | length) < 2 or ($tail | length) < 2
                  or ($head[0] | length) + ($start | length) + ($end | length) + ($tail[-1] | length) > ($old | length)
               then error("README has no \($start) ... \($end) block") else . end)
            | ($head[0] + $start + "\n\n```txt\n" + $stats + "\n```\n\n" + $end + $tail[-1]) as $new
            | if $new == $old then empty else {message: $ENV.COMMIT_MESSAGE, content: ($new | @base64), sha: $file.sha} end
          ' stats.json readme.json > body.json

          [ -s body.json ] || { echo "README already up to date"; exit 0; }

          curl -sS --fail-with-body --max-time 30 -X PUT "${github[@]}" -d @body.json "$readme_url" -o commit.json || fail $? commit.json
          jq -r .commit.html_url commit.json
